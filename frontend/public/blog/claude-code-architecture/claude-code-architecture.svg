<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a" />
      <stop offset="100%" style="stop-color:#1a1a3e" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7" />
      <stop offset="100%" style="stop-color:#5a4bd1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894" />
      <stop offset="100%" style="stop-color:#00a37d" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055" />
      <stop offset="100%" style="stop-color:#c0553e" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3" />
      <stop offset="100%" style="stop-color:#0770c2" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e" />
      <stop offset="100%" style="stop-color:#e0b050" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e84393" />
      <stop offset="100%" style="stop-color:#c7357d" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffffff" opacity="0.5"/>
    </marker>
    <marker id="arrTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#55efc4" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="1">Claude Code: System Architecture</text>
  <text x="500" y="64" text-anchor="middle" fill="#a29bfe" font-size="13" opacity="0.8">Component overview and data flow</text>

  <!-- ===== CONTEXT LOADING (Top Left) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="90" width="200" height="140" rx="10" fill="#1e1e3a" stroke="#6c5ce7" stroke-width="1.5"/>
    <rect x="30" y="90" width="200" height="32" rx="10" fill="url(#purple)"/>
    <rect x="30" y="110" width="200" height="12" fill="url(#purple)"/>
    <text x="130" y="112" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">CONTEXT LOADING</text>
    <text x="50" y="148" fill="#a29bfe" font-size="11" font-weight="600">Cloud MD</text>
    <text x="50" y="165" fill="#bbb" font-size="10">Project conventions</text>
    <text x="50" y="185" fill="#a29bfe" font-size="11" font-weight="600">Skills</text>
    <text x="50" y="202" fill="#bbb" font-size="10">Reusable task templates</text>
  </g>

  <!-- ===== AI MODEL (Center Top) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="90" width="380" height="140" rx="10" fill="#1e1e3a" stroke="#0984e3" stroke-width="1.5"/>
    <rect x="310" y="90" width="380" height="32" rx="10" fill="url(#blue)"/>
    <rect x="310" y="110" width="380" height="12" fill="url(#blue)"/>
    <text x="500" y="112" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">AI MODEL (Reasoning Engine)</text>
    <text x="340" y="150" fill="#74b9ff" font-size="11" font-weight="600">Decision Making</text>
    <text x="340" y="167" fill="#bbb" font-size="10">Analyzes context, picks next tool</text>
    <text x="340" y="195" fill="#74b9ff" font-size="11" font-weight="600">Looped Reasoning</text>
    <text x="340" y="212" fill="#bbb" font-size="10">Iterates until task complete</text>
    <!-- mini loop icon -->
    <circle cx="640" cy="175" r="30" fill="none" stroke="#74b9ff" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
    <text x="640" y="180" text-anchor="middle" fill="#74b9ff" font-size="20" opacity="0.6">&#x21BB;</text>
  </g>

  <!-- ===== MEMORY SYSTEM (Top Right) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="770" y="90" width="200" height="140" rx="10" fill="#1e1e3a" stroke="#fdcb6e" stroke-width="1.5"/>
    <rect x="770" y="90" width="200" height="32" rx="10" fill="url(#gold)"/>
    <rect x="770" y="110" width="200" height="12" fill="url(#gold)"/>
    <text x="870" y="112" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">MEMORY SYSTEM</text>
    <text x="790" y="148" fill="#ffeaa7" font-size="11" font-weight="600">Session State</text>
    <text x="790" y="165" fill="#bbb" font-size="10">Task progress tracking</text>
    <text x="790" y="185" fill="#ffeaa7" font-size="11" font-weight="600">Compaction</text>
    <text x="790" y="202" fill="#bbb" font-size="10">Summarize old history</text>
  </g>

  <!-- ===== HOOKS MIDDLEWARE (Center) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="280" width="760" height="80" rx="10" fill="#1e1e3a" stroke="#e17055" stroke-width="1.5"/>
    <rect x="120" y="280" width="760" height="32" rx="10" fill="url(#orange)"/>
    <rect x="120" y="300" width="760" height="12" fill="url(#orange)"/>
    <text x="500" y="302" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">HOOKS MIDDLEWARE</text>
    <text x="170" y="340" fill="#fab1a0" font-size="11">Pre-execution inspection</text>
    <text x="390" y="340" fill="#fab1a0" font-size="11">Command validation &amp; safety</text>
    <text x="640" y="340" fill="#fab1a0" font-size="11">Post-execution logging</text>
    <!-- dots -->
    <circle cx="355" cy="337" r="2" fill="#fab1a0" opacity="0.5"/>
    <circle cx="610" cy="337" r="2" fill="#fab1a0" opacity="0.5"/>
  </g>

  <!-- ===== TOOL REGISTRY (Bottom) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="410" width="760" height="120" rx="10" fill="#1e1e3a" stroke="#00b894" stroke-width="1.5"/>
    <rect x="120" y="410" width="760" height="32" rx="10" fill="url(#teal)"/>
    <rect x="120" y="430" width="760" height="12" fill="url(#teal)"/>
    <text x="500" y="432" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TOOL REGISTRY (20+ Tools)</text>
  </g>
  <!-- Tool cards -->
  <g>
    <rect x="145" y="460" width="110" height="50" rx="6" fill="#0d3d2d" stroke="#00b894" stroke-width="1" opacity="0.8"/>
    <text x="200" y="482" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="600">File Read/Write</text>
    <text x="200" y="498" text-anchor="middle" fill="#bbb" font-size="9">FS operations</text>
  </g>
  <g>
    <rect x="275" y="460" width="110" height="50" rx="6" fill="#0d3d2d" stroke="#00b894" stroke-width="1" opacity="0.8"/>
    <text x="330" y="482" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="600">Shell Commands</text>
    <text x="330" y="498" text-anchor="middle" fill="#bbb" font-size="9">Bash execution</text>
  </g>
  <g>
    <rect x="405" y="460" width="110" height="50" rx="6" fill="#0d3d2d" stroke="#00b894" stroke-width="1" opacity="0.8"/>
    <text x="460" y="482" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="600">Web Search</text>
    <text x="460" y="498" text-anchor="middle" fill="#bbb" font-size="9">Internet access</text>
  </g>
  <g>
    <rect x="535" y="460" width="110" height="50" rx="6" fill="#0d3d2d" stroke="#00b894" stroke-width="1" opacity="0.8"/>
    <text x="590" y="482" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="600">Pattern Match</text>
    <text x="590" y="498" text-anchor="middle" fill="#bbb" font-size="9">Grep / Glob</text>
  </g>
  <g>
    <rect x="665" y="460" width="110" height="50" rx="6" fill="#0d3d2d" stroke="#00b894" stroke-width="1" opacity="0.8"/>
    <text x="720" y="482" text-anchor="middle" fill="#55efc4" font-size="10" font-weight="600">Sub Agents</text>
    <text x="720" y="498" text-anchor="middle" fill="#bbb" font-size="9">Parallel tasks</text>
  </g>

  <!-- ===== SUB AGENT DETAIL (Bottom) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="570" width="760" height="55" rx="10" fill="#1e1e3a" stroke="#e84393" stroke-width="1.5"/>
    <rect x="120" y="570" width="760" height="28" rx="10" fill="url(#pink)"/>
    <rect x="120" y="588" width="760" height="10" fill="url(#pink)"/>
    <text x="500" y="590" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">SUB AGENTS (Distributed Workers)</text>
    <text x="170" y="613" fill="#fd79a8" font-size="10">Code Review</text>
    <text x="310" y="613" fill="#fd79a8" font-size="10">Test Generation</text>
    <text x="470" y="613" fill="#fd79a8" font-size="10">Security Scans</text>
    <text x="620" y="613" fill="#fd79a8" font-size="10">Documentation</text>
    <text x="770" y="613" fill="#fd79a8" font-size="10">Refactoring</text>
  </g>

  <!-- ===== Arrows ===== -->
  <!-- Context -> AI Model -->
  <line x1="230" y1="160" x2="308" y2="160" stroke="#a29bfe" stroke-width="1.5" marker-end="url(#arr)" opacity="0.6"/>
  <!-- AI Model <-> Memory -->
  <line x1="690" y1="155" x2="768" y2="155" stroke="#ffeaa7" stroke-width="1.5" marker-end="url(#arr)" opacity="0.5"/>
  <line x1="768" y1="170" x2="690" y2="170" stroke="#ffeaa7" stroke-width="1.5" marker-end="url(#arr)" opacity="0.5"/>
  <!-- AI Model -> Hooks -->
  <line x1="500" y1="230" x2="500" y2="278" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arr)" opacity="0.5"/>
  <!-- Hooks -> Tools -->
  <line x1="500" y1="360" x2="500" y2="408" stroke="#55efc4" stroke-width="1.5" marker-end="url(#arrTeal)" opacity="0.7"/>
  <!-- Tools -> Sub Agents -->
  <line x1="720" y1="510" x2="720" y2="568" stroke="#fd79a8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" opacity="0.5"/>

  <!-- Flow labels -->
  <text x="510" y="260" fill="#ffffff" font-size="9" opacity="0.5">tool calls</text>
  <text x="510" y="395" fill="#55efc4" font-size="9" opacity="0.6">validated calls</text>
  <text x="730" y="545" fill="#fd79a8" font-size="9" opacity="0.5">spawn</text>

  <!-- Watermark -->
  <text x="500" y="690" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.2">Claude Code System Architecture Diagram</text>
</svg>