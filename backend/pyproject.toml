[tool.poetry]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI + LangGraph chat backend for portfolio"
authors = ["Dhiraj Poddar <dhirajpoddar@outlook.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.135.2"
uvicorn = {extras = ["standard"], version = "^0.42.0"}
langchain = "^1.2.13"
langchain-groq = "^1.1.2"
langchain-google-genai = "^2.0.0"
langchain-openai = "^1.0.0"
langgraph = "^1.1.3"
pydantic-settings = "^2.13.1"
python-dotenv = "^1.2.2"
python-frontmatter = "^1.1.0"
httpx = "^0.27.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
