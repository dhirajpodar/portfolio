<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16132b"/>
    </linearGradient>
    <linearGradient id="structuredGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="100%" stop-color="#071f12"/>
    </linearGradient>
    <linearGradient id="agenticGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#13101a"/>
    </linearGradient>

    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowHeadGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowHeadAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Grid -->
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="420" y1="0" x2="420" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="660" y1="0" x2="660" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="780" y1="0" x2="780" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1140" y1="0" x2="1140" y2="600" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- ==================== TITLE ==================== -->
  <text x="600" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="0.5">Multi-Agent System — Request Flow</text>
  <text x="600" y="52" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="0.3">LangGraph · FastAPI · Hybrid Routing · 10 Domain Agents · Azure Container Apps</text>

  <!-- ==================== CLIENT LAYER ==================== -->
  <rect x="420" y="68" width="360" height="56" rx="8" fill="url(#clientGrad)" stroke="#334155" stroke-width="1"/>
  <text x="438" y="84" fill="#94a3b8" font-size="8" font-weight="600" letter-spacing="1.2">CLIENT LAYER</text>

  <rect x="440" y="92" width="140" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
  <text x="510" y="108" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-weight="500">🌐 Web App</text>

  <rect x="600" y="92" width="160" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
  <text x="680" y="108" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-weight="500">📱 Mobile App</text>

  <!-- Connection: Client → Gateway -->
  <line x1="600" y1="124" x2="600" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="618" y="138" fill="#64748b" font-size="7.5">HTTPS · REST · JSON</text>

  <!-- ==================== GATEWAY LAYER ==================== -->
  <rect x="80" y="148" width="1040" height="122" rx="10" fill="url(#gatewayGrad)" stroke="#2d2b55" stroke-width="1"/>
  <text x="98" y="168" fill="#a78bfa" font-size="9" font-weight="700" letter-spacing="1.2">GATEWAY LAYER</text>
  <text x="98" y="181" fill="#64748b" font-size="7.5">FastAPI · Azure Container Apps · 4 Gunicorn Workers</text>

  <!-- Security Middleware -->
  <rect x="98" y="192" width="185" height="64" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
  <text x="113" y="210" fill="#a5b4fc" font-size="9.5" font-weight="600">Security Middleware</text>
  <text x="113" y="224" fill="#818cf8" font-size="7.5">CORS · Rate Limiting · Headers</text>
  <text x="113" y="237" fill="#818cf8" font-size="7.5">JWE Auth · AES-256-GCM</text>
  <text x="113" y="250" fill="#6366f1" font-size="7">Stateless → Horizontal Scaling</text>

  <line x1="283" y1="224" x2="310" y2="224" stroke="#4338ca" stroke-width="1" marker-end="url(#arrowHeadBlue)"/>

  <!-- Translation Boundary -->
  <rect x="314" y="192" width="185" height="64" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
  <text x="329" y="210" fill="#a5b4fc" font-size="9.5" font-weight="600">Translation Boundary</text>
  <text x="329" y="224" fill="#818cf8" font-size="7.5">DE ⇄ EN at API edge</text>
  <text x="329" y="237" fill="#818cf8" font-size="7.5">Monolingual internal processing</text>
  <text x="329" y="250" fill="#6366f1" font-size="7">Per-request language context</text>

  <line x1="499" y1="224" x2="526" y2="224" stroke="#4338ca" stroke-width="1" marker-end="url(#arrowHeadPurple)"/>

  <!-- Hybrid Router -->
  <rect x="530" y="192" width="270" height="64" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
  <text x="545" y="210" fill="#c4b5fd" font-size="9.5" font-weight="700">Hybrid Router</text>
  <rect x="545" y="216" width="115" height="30" rx="4" fill="#312e81" stroke="#4338ca" stroke-width="0.5"/>
  <text x="553" y="230" fill="#a5b4fc" font-size="8" font-weight="600">Tier 1: Pattern Match</text>
  <text x="553" y="241" fill="#818cf8" font-size="7">~80% queries · 0 LLM cost</text>
  <rect x="670" y="216" width="115" height="30" rx="4" fill="#2e1065" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="678" y="230" fill="#c4b5fd" font-size="8" font-weight="600">Tier 2: LLM Classifier</text>
  <text x="678" y="241" fill="#a78bfa" font-size="7">~20% fallback</text>
  <rect x="545" y="248" width="70" height="3" rx="1.5" fill="#22c55e" opacity="0.6"/>
  <text x="622" y="253" fill="#6ee7b7" font-size="6.5">conf ≥ 0.85 → fast route</text>

  <!-- Cross-Worker State -->
  <rect x="830" y="192" width="275" height="64" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
  <text x="845" y="210" fill="#a5b4fc" font-size="9.5" font-weight="600">Cross-Worker State</text>
  <g transform="translate(845, 218)">
    <rect width="44" height="20" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="0.5"/>
    <text x="22" y="14" text-anchor="middle" fill="#a5b4fc" font-size="7.5">W1</text>
    <rect x="50" width="44" height="20" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="0.5"/>
    <text x="72" y="14" text-anchor="middle" fill="#a5b4fc" font-size="7.5">W2</text>
    <rect x="100" width="44" height="20" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="0.5"/>
    <text x="122" y="14" text-anchor="middle" fill="#a5b4fc" font-size="7.5">W3</text>
    <rect x="150" width="44" height="20" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="0.5"/>
    <text x="172" y="14" text-anchor="middle" fill="#a5b4fc" font-size="7.5">W4</text>
  </g>
  <text x="845" y="252" fill="#6366f1" font-size="7">Gunicorn · Uvicorn · PostgreSQL checkpoints</text>

  <!-- ==================== AGENT LAYER ==================== -->
  <!-- Connection: Router → Agents -->
  <line x1="600" y1="270" x2="600" y2="292" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowHeadPurple)"/>

  <rect x="80" y="296" width="1040" height="255" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="98" y="316" fill="#22c55e" font-size="9" font-weight="700" letter-spacing="1.2">AGENT LAYER</text>
  <text x="98" y="329" fill="#64748b" font-size="7.5">LangGraph · 10 Singleton Agents · Agent Registry provides frontend metadata</text>

  <!-- Structured Graph Agents -->
  <rect x="98" y="340" width="500" height="198" rx="8" fill="url(#structuredGrad)" stroke="#1a4a2e" stroke-width="1"/>
  <text x="116" y="358" fill="#6ee7b7" font-size="9" font-weight="700" letter-spacing="0.5">STRUCTURED GRAPH AGENTS</text>
  <text x="116" y="371" fill="#4ade80" font-size="7.5">Deterministic state transitions · Predictable execution paths</text>

  <!-- Extract -->
  <rect x="116" y="384" width="100" height="36" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="133" y="400" fill="#6ee7b7" font-size="8.5" font-weight="600">Extract</text>
  <text x="133" y="412" fill="#34d399" font-size="7">LLM parse params</text>

  <line x1="216" y1="402" x2="240" y2="402" stroke="#10b981" stroke-width="1" marker-end="url(#arrowHeadGreen)"/>

  <!-- Validate -->
  <rect x="244" y="384" width="90" height="36" rx="5" fill="#1c1508" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="261" y="400" fill="#fbbf24" font-size="8.5" font-weight="600">Validate</text>
  <text x="261" y="412" fill="#f59e0b" font-size="7">Check params</text>

  <!-- OK path -->
  <line x1="334" y1="402" x2="358" y2="402" stroke="#10b981" stroke-width="1" marker-end="url(#arrowHeadGreen)"/>
  <text x="339" y="394" fill="#22c55e" font-size="6.5">OK</text>

  <!-- Search API -->
  <rect x="362" y="384" width="100" height="36" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="379" y="400" fill="#6ee7b7" font-size="8.5" font-weight="600">Search API</text>
  <text x="379" y="412" fill="#34d399" font-size="7">Domain endpoint</text>

  <line x1="462" y1="402" x2="486" y2="402" stroke="#10b981" stroke-width="1" marker-end="url(#arrowHeadGreen)"/>

  <!-- Format -->
  <rect x="490" y="384" width="92" height="36" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="507" y="400" fill="#6ee7b7" font-size="8.5" font-weight="600">Format</text>
  <text x="507" y="412" fill="#34d399" font-size="7">Structured out</text>

  <!-- Ambiguous path -->
  <line x1="289" y1="420" x2="289" y2="442" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrowHeadAmber)"/>
  <text x="298" y="436" fill="#f59e0b" font-size="6.5">Ambiguous</text>
  <rect x="244" y="446" width="90" height="28" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="262" y="464" fill="#fbbf24" font-size="8.5" font-weight="500">Interrupt</text>
  <!-- Loop back -->
  <path d="M244 460 L210 460 L210 402 L220 402" stroke="#f59e0b" stroke-width="0.8" fill="none" marker-end="url(#arrowHeadAmber)" stroke-dasharray="3,2"/>
  <text x="198" y="433" fill="#f59e0b" font-size="6.5" transform="rotate(-90, 198, 433)">clarify</text>

  <!-- Agent chips for structured -->
  <g transform="translate(116, 486)">
    <rect width="56" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="28" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Metals</text>
    <rect x="62" width="68" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="96" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Chemical</text>
    <rect x="136" width="62" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="167" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Polymer</text>
    <rect x="204" width="80" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="244" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Raw Material</text>
    <rect x="290" width="82" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="331" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Construction</text>
    <rect x="378" width="78" height="18" rx="9" fill="#064e3b" stroke="#22c55e" stroke-width="0.6"/>
    <text x="417" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-weight="500">Agricultural</text>
  </g>

  <!-- Agentic Tool-Calling Agents -->
  <rect x="614" y="340" width="492" height="198" rx="8" fill="url(#agenticGrad)" stroke="#3a2555" stroke-width="1"/>
  <text x="632" y="358" fill="#c4b5fd" font-size="9" font-weight="700" letter-spacing="0.5">AGENTIC TOOL-CALLING AGENTS</text>
  <text x="632" y="371" fill="#a78bfa" font-size="7.5">Autonomous reasoning loop · Dynamic tool selection</text>

  <!-- Observe -->
  <rect x="632" y="384" width="88" height="36" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="649" y="400" fill="#c4b5fd" font-size="8.5" font-weight="600">Observe</text>
  <text x="649" y="412" fill="#a78bfa" font-size="7">Query + history</text>

  <line x1="720" y1="402" x2="744" y2="402" stroke="#8b5cf6" stroke-width="1" marker-end="url(#arrowHeadPurple)"/>

  <!-- Think -->
  <rect x="748" y="384" width="88" height="36" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="765" y="400" fill="#c4b5fd" font-size="8.5" font-weight="600">Think</text>
  <text x="765" y="412" fill="#a78bfa" font-size="7">LLM selects tool</text>

  <line x1="836" y1="402" x2="860" y2="402" stroke="#8b5cf6" stroke-width="1" marker-end="url(#arrowHeadPurple)"/>

  <!-- Act -->
  <rect x="864" y="384" width="88" height="36" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="881" y="400" fill="#c4b5fd" font-size="8.5" font-weight="600">Act</text>
  <text x="881" y="412" fill="#a78bfa" font-size="7">Execute tool</text>

  <line x1="952" y1="402" x2="976" y2="402" stroke="#8b5cf6" stroke-width="1" marker-end="url(#arrowHeadPurple)"/>

  <!-- Decision diamond -->
  <polygon points="1002,384 1036,402 1002,420 968,402" fill="#1c1508" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="989" y="404" fill="#fbbf24" font-size="7.5" font-weight="600">Done?</text>

  <!-- No loop back -->
  <path d="M1002 420 L1002 448 L676 448 L676 420" stroke="#f59e0b" stroke-width="0.8" fill="none" marker-end="url(#arrowHeadAmber)" stroke-dasharray="3,2"/>
  <text x="838" y="461" text-anchor="middle" fill="#f59e0b" font-size="7">No — need more data</text>

  <!-- Yes to final answer -->
  <line x1="1036" y1="402" x2="1058" y2="402" stroke="#22c55e" stroke-width="1"/>
  <rect x="1058" y="386" width="42" height="32" rx="5" fill="#064e3b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="1064" y="406" fill="#6ee7b7" font-size="8" font-weight="600">Final</text>
  <text x="1040" y="382" fill="#22c55e" font-size="6.5">Yes</text>

  <!-- Agent chips for agentic -->
  <g transform="translate(632, 486)">
    <rect width="85" height="18" rx="9" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.6"/>
    <text x="42" y="13" text-anchor="middle" fill="#c4b5fd" font-size="7.5" font-weight="500">Packaging</text>
    <rect x="91" width="88" height="18" rx="9" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.6"/>
    <text x="135" y="13" text-anchor="middle" fill="#c4b5fd" font-size="7.5" font-weight="500">Electronics</text>
    <rect x="185" width="78" height="18" rx="9" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.6"/>
    <text x="224" y="13" text-anchor="middle" fill="#c4b5fd" font-size="7.5" font-weight="500">Machine</text>
    <rect x="269" width="78" height="18" rx="9" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.6"/>
    <text x="308" y="13" text-anchor="middle" fill="#c4b5fd" font-size="7.5" font-weight="500">Regional</text>
  </g>

  <!-- Thread note -->
  <text x="98" y="530" fill="#64748b" font-size="7.5">Thread ID: {session_id}_{agent_type} · Singleton lifecycle · Agent registry provides frontend metadata for dynamic UI rendering</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="80" y="556" width="1040" height="30" rx="6" fill="#0a0e1a" stroke="#1e293b" stroke-width="0.8"/>

  <line x1="100" y1="574" x2="130" y2="574" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="137" y="577" fill="#94a3b8" font-size="7.5">Data flow</text>

  <line x1="220" y1="574" x2="250" y2="574" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrowHeadAmber)"/>
  <text x="257" y="577" fill="#94a3b8" font-size="7.5">Fallback / retry loop</text>

  <rect x="395" y="568" width="12" height="12" rx="3" fill="#064e3b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="413" y="577" fill="#94a3b8" font-size="7.5">Structured agents (deterministic)</text>

  <rect x="600" y="568" width="12" height="12" rx="3" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="618" y="577" fill="#94a3b8" font-size="7.5">Agentic agents (autonomous)</text>

  <rect x="795" y="568" width="12" height="12" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
  <text x="813" y="577" fill="#94a3b8" font-size="7.5">Gateway component</text>

  <text x="940" y="577" fill="#475569" font-size="7">FastAPI · LangGraph · Azure</text>
</svg>