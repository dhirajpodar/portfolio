<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7" />
      <stop offset="100%" style="stop-color:#a29bfe" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894" />
      <stop offset="100%" style="stop-color:#55efc4" />
    </linearGradient>
    <filter id="sh3">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a29bfe" opacity="0.7"/>
    </marker>
    <marker id="a3g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#55efc4" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="1">Sub-Agent Orchestration Pattern</text>
  <text x="450" y="64" text-anchor="middle" fill="#a29bfe" font-size="13" opacity="0.8">Distributed task delegation with parallel execution</text>

  <!-- MAIN AGENT / ORCHESTRATOR -->
  <g filter="url(#sh3)">
    <rect x="310" y="90" width="280" height="100" rx="12" fill="#1e1e3a" stroke="#6c5ce7" stroke-width="2"/>
    <rect x="310" y="90" width="280" height="35" rx="12" fill="url(#masterGrad)"/>
    <rect x="310" y="113" width="280" height="12" fill="url(#masterGrad)"/>
    <text x="450" y="115" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">MAIN AGENT (Orchestrator)</text>
    <text x="340" y="148" fill="#ccc" font-size="10">Breaks complex task into subtasks</text>
    <text x="340" y="165" fill="#ccc" font-size="10">Spawns workers, collects results</text>
  </g>

  <!-- Spawn arrows down -->
  <line x1="250" y1="195" x2="130" y2="280" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a3)"/>
  <line x1="380" y1="195" x2="330" y2="280" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a3)"/>
  <line x1="520" y1="195" x2="530" y2="280" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a3)"/>
  <line x1="650" y1="195" x2="730" y2="280" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a3)"/>

  <!-- spawn label -->
  <text x="190" y="240" fill="#a29bfe" font-size="9" opacity="0.7" transform="rotate(-25, 190, 240)">spawn</text>
  <text x="355" y="240" fill="#a29bfe" font-size="9" opacity="0.7" transform="rotate(-10, 355, 240)">spawn</text>
  <text x="530" y="240" fill="#a29bfe" font-size="9" opacity="0.7" transform="rotate(5, 530, 240)">spawn</text>
  <text x="690" y="240" fill="#a29bfe" font-size="9" opacity="0.7" transform="rotate(20, 690, 240)">spawn</text>

  <!-- SUB AGENT 1 -->
  <g filter="url(#sh3)">
    <rect x="40" y="280" width="180" height="130" rx="10" fill="#1e1e3a" stroke="#00b894" stroke-width="1.5"/>
    <rect x="40" y="280" width="180" height="30" rx="10" fill="url(#workerGrad)"/>
    <rect x="40" y="300" width="180" height="10" fill="url(#workerGrad)"/>
    <text x="130" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Code Review</text>
    <!-- mini loop -->
    <circle cx="130" cy="355" r="22" fill="none" stroke="#55efc4" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
    <text x="130" y="335" text-anchor="middle" fill="#55efc4" font-size="9">Own loop</text>
    <text x="130" y="360" text-anchor="middle" fill="#55efc4" font-size="16" opacity="0.5">&#x21BB;</text>
    <text x="130" y="395" text-anchor="middle" fill="#bbb" font-size="9">Analyze diffs</text>
  </g>

  <!-- SUB AGENT 2 -->
  <g filter="url(#sh3)">
    <rect x="240" y="280" width="180" height="130" rx="10" fill="#1e1e3a" stroke="#00b894" stroke-width="1.5"/>
    <rect x="240" y="280" width="180" height="30" rx="10" fill="url(#workerGrad)"/>
    <rect x="240" y="300" width="180" height="10" fill="url(#workerGrad)"/>
    <text x="330" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Test Generation</text>
    <circle cx="330" cy="355" r="22" fill="none" stroke="#55efc4" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
    <text x="330" y="335" text-anchor="middle" fill="#55efc4" font-size="9">Own loop</text>
    <text x="330" y="360" text-anchor="middle" fill="#55efc4" font-size="16" opacity="0.5">&#x21BB;</text>
    <text x="330" y="395" text-anchor="middle" fill="#bbb" font-size="9">Write test suites</text>
  </g>

  <!-- SUB AGENT 3 -->
  <g filter="url(#sh3)">
    <rect x="440" y="280" width="180" height="130" rx="10" fill="#1e1e3a" stroke="#00b894" stroke-width="1.5"/>
    <rect x="440" y="280" width="180" height="30" rx="10" fill="url(#workerGrad)"/>
    <rect x="440" y="300" width="180" height="10" fill="url(#workerGrad)"/>
    <text x="530" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Security Scan</text>
    <circle cx="530" cy="355" r="22" fill="none" stroke="#55efc4" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
    <text x="530" y="335" text-anchor="middle" fill="#55efc4" font-size="9">Own loop</text>
    <text x="530" y="360" text-anchor="middle" fill="#55efc4" font-size="16" opacity="0.5">&#x21BB;</text>
    <text x="530" y="395" text-anchor="middle" fill="#bbb" font-size="9">Vuln detection</text>
  </g>

  <!-- SUB AGENT 4 -->
  <g filter="url(#sh3)">
    <rect x="640" y="280" width="180" height="130" rx="10" fill="#1e1e3a" stroke="#00b894" stroke-width="1.5"/>
    <rect x="640" y="280" width="180" height="30" rx="10" fill="url(#workerGrad)"/>
    <rect x="640" y="300" width="180" height="10" fill="url(#workerGrad)"/>
    <text x="730" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Documentation</text>
    <circle cx="730" cy="355" r="22" fill="none" stroke="#55efc4" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
    <text x="730" y="335" text-anchor="middle" fill="#55efc4" font-size="9">Own loop</text>
    <text x="730" y="360" text-anchor="middle" fill="#55efc4" font-size="16" opacity="0.5">&#x21BB;</text>
    <text x="730" y="395" text-anchor="middle" fill="#bbb" font-size="9">Generate docs</text>
  </g>

  <!-- Return arrows -->
  <line x1="130" y1="410" x2="350" y2="470" stroke="#55efc4" stroke-width="1.5" marker-end="url(#a3g)" opacity="0.5"/>
  <line x1="330" y1="410" x2="400" y2="470" stroke="#55efc4" stroke-width="1.5" marker-end="url(#a3g)" opacity="0.5"/>
  <line x1="530" y1="410" x2="500" y2="470" stroke="#55efc4" stroke-width="1.5" marker-end="url(#a3g)" opacity="0.5"/>
  <line x1="730" y1="410" x2="550" y2="470" stroke="#55efc4" stroke-width="1.5" marker-end="url(#a3g)" opacity="0.5"/>

  <!-- return label -->
  <text x="450" y="445" text-anchor="middle" fill="#55efc4" font-size="9" opacity="0.7">results</text>

  <!-- RESULT AGGREGATION -->
  <g filter="url(#sh3)">
    <rect x="310" y="465" width="280" height="60" rx="10" fill="#1e1e3a" stroke="#fdcb6e" stroke-width="1.5"/>
    <rect x="310" y="465" width="280" height="28" rx="10" fill="#e0b050"/>
    <rect x="310" y="483" width="280" height="10" fill="#e0b050"/>
    <text x="450" y="487" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">RESULT AGGREGATION</text>
    <text x="450" y="513" text-anchor="middle" fill="#ffeaa7" font-size="10">Merge parallel outputs into final result</text>
  </g>

  <!-- Parallel execution indicator -->
  <rect x="35" y="265" width="790" height="2" rx="1" fill="#55efc4" opacity="0.15"/>
  <text x="850" y="270" text-anchor="end" fill="#55efc4" font-size="9" opacity="0.4">parallel execution</text>
</svg>